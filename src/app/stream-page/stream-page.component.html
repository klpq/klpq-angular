<div class="stream-page">
  <header class="stream-header">
    <div class="header-inner">
      <a
        *ngIf="showNavigation"
        class="home-link"
        [href]="homeUrl"
        aria-label="KLPQ home"
      >
        <img
          src="/assets/images/stream/klpq.svg"
          alt=""
          width="34"
          height="34"
        />
      </a>

      <div class="channel-toolbar">
        <div class="channel-heading">
          <h1>{{ stream }}</h1>
          <span *ngIf="stats.isLive" class="live-indicator">Live</span>
        </div>
        <app-channel-picker
          *ngIf="showNavigation"
          [channel]="stream"
          [selectedQuality]="selectedQuality"
        ></app-channel-picker>
      </div>
    </div>
  </header>

  <main class="watch-area">
    <div class="player-frame">
      <div #playerContainer class="player-section"></div>
      <div *ngIf="playerMessage as message" class="player-status" role="status">
        <div class="status-content">
          <i class="fas" [ngClass]="message.icon" aria-hidden="true"></i>
          <p>{{ message.title }}</p>
          <span>{{ message.description }}</span>
        </div>
      </div>
    </div>

    <div *ngIf="stats.isLive" class="stream-info">
      <span class="stat">
        <i class="fas fa-users" aria-hidden="true"></i>
        <span
          ><strong>{{ stats.viewers ?? 0 | number }}</strong> viewers</span
        >
      </span>
      <span class="stat" *ngIf="stats.duration">
        <i class="fas fa-clock" aria-hidden="true"></i>
        <span
          ><strong>{{ stats.duration }}</strong> elapsed</span
        >
      </span>
      <span class="stat">
        <i class="fas fa-signal" aria-hidden="true"></i>
        <span
          >Bitrate
          <strong>{{ (stats.bitrate | number) ?? 'Unavailable' }}</strong></span
        >
      </span>
    </div>
  </main>
</div>
