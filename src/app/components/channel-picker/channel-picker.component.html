<ng-container *ngIf="channels$ | async as channels">
  <div class="picker">
    <button
      #channelButton
      type="button"
      [attr.aria-expanded]="openMenu === 'channels'"
      aria-controls="channel-options"
      (click)="toggleMenu('channels')"
    >
      Channels
    </button>

    <div
      id="channel-options"
      class="options"
      [hidden]="openMenu !== 'channels'"
    >
      <p *ngIf="!channels.online.length && !channels.offline.length">
        No saved channels
      </p>
      <ng-container
        *ngFor="
          let group of [channels.online, channels.offline];
          let live = first
        "
      >
        <div class="channel-option" *ngFor="let name of group">
          <a
            [routerLink]="['/', name]"
            [attr.aria-current]="channel === name ? 'true' : null"
            (click)="openMenu = null"
          >
            <span>{{ name }}</span>
            <small *ngIf="live">Live</small>
          </a>
          <button
            type="button"
            class="remove-channel"
            [attr.aria-label]="'Remove ' + name + ' from saved channels'"
            (click)="removeChannel(name)"
          >
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </ng-container>
    </div>
  </div>

  <div class="picker">
    <button
      #qualityButton
      type="button"
      [attr.aria-expanded]="openMenu === 'quality'"
      aria-controls="quality-options"
      (click)="toggleMenu('quality')"
    >
      Quality
    </button>

    <div id="quality-options" class="options" [hidden]="openMenu !== 'quality'">
      <p
        *ngIf="
          !channels.qualityOnline.length && !channels.qualityOffline.length
        "
      >
        No quality options available
      </p>
      <ng-container
        *ngFor="
          let group of [channels.qualityOnline, channels.qualityOffline];
          let live = first
        "
      >
        <a
          *ngFor="let quality of group"
          [routerLink]="'/' + quality.path"
          [attr.aria-current]="quality.path === selectedQuality ? 'true' : null"
          (click)="openMenu = null"
        >
          <span>{{ quality.label }}</span>
          <small *ngIf="live">Live</small>
        </a>
      </ng-container>
    </div>
  </div>
</ng-container>
