<main class="station" [class.receiving]="transmission">
  <header class="station-header">
    <button
      type="button"
      class="sound-control"
      [attr.aria-pressed]="soundOn"
      (click)="toggleSound()"
    >
      <i
        class="fas"
        [ngClass]="soundOn ? 'fa-volume-up' : 'fa-volume-mute'"
        aria-hidden="true"
      ></i>
      Sound
    </button>
    <a href="/stream" class="watch-link">Watch stream</a>
  </header>

  <div class="signs">
    <h1 aria-label="KLPQ">KLP<span>Q</span></h1>
    <div class="signal">
      {{
        transmission
          ? 'TRANSMISSION RECEIVED'
          : crossing
          ? 'BOARS HAVE RIGHT OF WAY'
          : 'SIGNAL FOUND'
      }}
    </div>
  </div>

  <div class="scene" aria-hidden="true">
    <canvas #rendererCanvas></canvas>
  </div>

  <button
    type="button"
    class="boar"
    aria-label="Tune in to the hidden transmission"
    (click)="receiveTransmission()"
  >
    <img src="/assets/images/index/boar.png" alt="" />
  </button>

  <p class="transmission" role="status">{{ transmission }}</p>

  <audio
    #ambience
    src="/assets/images/index/audio.mp3"
    preload="none"
    loop
  ></audio>
  <video
    *ngFor="let id of screenVideos"
    #feed
    [src]="'/assets/images/index/' + id + '.mp4'"
    [muted]="true"
    playsinline
    loop
    preload="none"
    hidden
  ></video>
</main>
